gspring.application.name=personalfinanceapi

# -----------------------------------------------------------------------------
# JWT configuration
# -----------------------------------------------------------------------------
# Secrets MUST be base64-encoded strings at least 256 bits long for HS256.
# The refresh secret should differ from the access secret.
# The keys are passed from system environment variables
jwt.secret=${JWT_SECRET}

# Access token: 15 minutes as milisecond
jwt.expiration=900000
# Refresh token: 30 days as milisecond
jwt.refresh.expiration=2592000000